name: aztectrials

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${BUGGYPYRAMID_DB_NAME}
      - POSTGRES_USER=${BUGGYPYRAMID_DB_USER}
      - POSTGRES_PASSWORD=${BUGGYPYRAMID_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - effective_cache_size=192MB
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=256MB
      - -c
      - min_wal_size=64MB
      - -c
      - checkpoint_timeout=10min
      - -c
      - checkpoint_completion_target=0.9
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks:
      - backend
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 120
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: aztectrials/server:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - BUGGYPYRAMID_ADMIN_KEY=${BUGGYPYRAMID_ADMIN_KEY}
      - BUGGYPYRAMID_GEOIP_DB_PATH=/app/GeoLite2-City.mmdb
      - BUGGYPYRAMID_DB_HOST=db
      - BUGGYPYRAMID_DB_PORT=5432
      - BUGGYPYRAMID_DB_NAME=${BUGGYPYRAMID_DB_NAME}
      - BUGGYPYRAMID_DB_USER=${BUGGYPYRAMID_DB_USER}
      - BUGGYPYRAMID_DB_PASSWORD=${BUGGYPYRAMID_DB_PASSWORD}
    networks:
      backend:
        aliases:
          - server
      edge:
        aliases:
          - aztectrials-server
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.admin
    image: aztectrials/admin:local
    restart: unless-stopped
    ports:
      - "${BUGGYPYRAMID_ADMIN_BIND_IP:-192.168.178.27}:${BUGGYPYRAMID_ADMIN_PORT:-8082}:80"
    depends_on:
      - api
    networks:
      - backend
      - admin_access
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    name: aztectrials_edge
  admin_access:
    name: aztectrials_admin_access
  backend:
    name: aztectrials_backend
    internal: true

volumes:
  postgres_data:
    name: aztectrials_postgres_data