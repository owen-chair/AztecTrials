server {
  listen 80;
  server_name _;

  # Diagnostics endpoint for clients that don't have curl/wget.
  # Served directly by nginx (does not hit the Go server).
  location = /_diag/ping {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  # LetsEncrypt HTTP-01 challenge
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  # NOTE: Do not force-redirect to HTTPS here.
  # Some clients / edge proxies terminate TLS upstream and connect to the origin
  # over HTTP; forcing a redirect can cause a 301 loop ("redirect limit exceeded").
  # Only allow the real public API endpoints.
  location ^~ /time/submit/ {
    limit_except GET { deny all; }
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /data/top10/ {
    limit_except GET { deny all; }
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /data/top100/ {
    limit_except GET { deny all; }
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /data/page/ {
    limit_except GET { deny all; }
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /data/personal/ {
    limit_except GET { deny all; }
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /metrics/checkpointUnlock/ {
    limit_except GET { deny all; }
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /metrics/genericMetric {
    return 404;
  }

  location ^~ /metrics/genericMetric/ {
    limit_except GET POST { deny all; }
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Everything else is not a public endpoint.
  location / {
    return 404;
  }
}

server {
  listen 443 ssl;
  server_name _;

  # Cert paths are injected by the container entrypoint.
  ssl_certificate ${BUGGYPYRAMID_SSL_CERT_FILE};
  ssl_certificate_key ${BUGGYPYRAMID_SSL_KEY_FILE};
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=15552000" always;

  # Diagnostics endpoint for clients that don't have curl/wget.
  # Served directly by nginx (does not hit the Go server).
  location = /_diag/ping {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  # Don't advertise anything on the root path.
  location = / {
    return 444;
  }

  # Never expose admin endpoints on the public listener.
  location ^~ /admin/ {
    return 404;
  }
  location = /admin {
    return 404;
  }

  # Only allow the real public API endpoints.
  location ^~ /time/submit/ {
    limit_except GET { deny all; }
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ^~ /data/top10/ {
    limit_except GET { deny all; }
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ^~ /data/top100/ {
    limit_except GET { deny all; }
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ^~ /data/page/ {
    limit_except GET { deny all; }
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ^~ /data/personal/ {
    limit_except GET { deny all; }
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ^~ /metrics/checkpointUnlock/ {
    limit_except GET { deny all; }
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /metrics/genericMetric {
    return 404;
  }

  location ^~ /metrics/genericMetric/ {
    limit_except GET POST { deny all; }
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Everything else is not a public endpoint.
  location / {
    return 404;
  }
}
