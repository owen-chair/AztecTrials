# Current collector output and future native nginx output share this format:
# vhost, combined nginx fields, X-Forwarded-For, TLS protocol, request seconds.
log-format %v %h %^[%d:%t %^] "%r" %s %b "%R" "%u" "%^" %K %T
date-format %d/%b/%Y
time-format %T

geoip-database /geoip/GeoLite2-City.mmdb

agent-list true
http-method yes
http-protocol yes
real-os true
unknowns-as-crawlers true
444-as-404 true
4xx-to-unique-count true
all-static-files true
enable-panel REFERRERS
enable-panel TLS_TYPE

html-refresh 2
html-report-title AztecTrials and BuggyPyramid Traffic
html-prefs {"theme":"bright","perPage":10,"layout":"horizontal","showTables":true}
max-items 50
jobs 2

static-file .css
static-file .js
static-file .png
static-file .jpg
static-file .jpeg
static-file .gif
static-file .svg
static-file .ico
static-file .woff
static-file .woff2
static-file .map

# Defense in depth; the collector already drops these sources.
exclude-ip 127.0.0.1
exclude-ip ::1
exclude-ip 192.168.178.27
exclude-ip 172.16.0.0-172.31.255.255
