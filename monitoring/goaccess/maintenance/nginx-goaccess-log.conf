# MAINTENANCE-WINDOW CONFIGURATION: do not install or reload now.
# These directives are valid in nginx's http context, before any server blocks.

map $ssl_protocol $goaccess_tls {
    default $ssl_protocol;
    ""      NONE;
}

map $remote_addr $goaccess_source_noise {
    default 0;
    127.0.0.1 1;
    ::1 1;
    192.168.178.27 1;
    ~^172\.(1[6-9]|2[0-9]|3[01])\. 1;
}

map "$goaccess_source_noise:$request_uri" $goaccess_loggable {
    default 1;
    ~^1: 0;
    ~^0:/_diag/ping(?:\?|$) 0;
}

log_format goaccess_enriched
    '$host $remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
    '"$http_x_forwarded_for" $goaccess_tls $request_time';

# Add this directive inside EACH public server block. A server-level access_log
# overrides the inherited Docker stdout log for that server.
#
# access_log /var/log/nginx/goaccess/access.log goaccess_enriched if=$goaccess_loggable;
